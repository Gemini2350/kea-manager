[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisord.sock

[program:kea-dhcp4]
command=/usr/sbin/kea-dhcp4 -c /etc/kea/kea-dhcp4.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/kea-dhcp4.err.log
stdout_logfile=/var/log/supervisor/kea-dhcp4.out.log
user=kea
environment=HOME="/var/lib/kea",USER="kea"

[program:kea-dhcp-ddns]
command=/usr/sbin/kea-dhcp-ddns -c /etc/kea/kea-dhcp-ddns.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/kea-dhcp-ddns.err.log
stdout_logfile=/var/log/supervisor/kea-dhcp-ddns.out.log
user=kea
environment=HOME="/var/lib/kea",USER="kea"

[program:flask-web]
command=/usr/bin/python3 /app/app.py
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/flask-web.err.log
stdout_logfile=/var/log/supervisor/flask-web.out.log
user=root
environment=HOME="/root",USER="root"
