{
  "DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea-ddns-ctrl-socket"
    },

    "tsig-keys": [
      {
        "name": "ddns-key",
        "algorithm": "HMAC-SHA256",
        "secret": "REPLACE_WITH_BASE64_TSIG_KEY"
      }
    ],

    "forward-ddns": {
      "ddns-domains": [
        {
          "name": "simplexity.training.",
          "key-name": "ddns-key",
          "dns-servers": [
            { "ip-address": "10.0.100.1" }
          ]
        }
      ]
    },

    "reverse-ddns": {
      "ddns-domains": [
        {
          "name": "1.10.in-addr.arpa.",
          "key-name": "ddns-key",
          "dns-servers": [
            { "ip-address": "10.0.100.1" }
          ]
        },
        {
          "name": "2.10.in-addr.arpa.",
          "key-name": "ddns-key",
          "dns-servers": [
            { "ip-address": "10.0.100.1" }
          ]
        }
      ]
    },

    "loggers": [
      {
        "name": "kea-dhcp-ddns",
        "output_options": [
          { "output": "stdout" }
        ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
