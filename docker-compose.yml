# KEA DHCP Manager -- deployment via the published Docker Hub image.
# Host networking is required: DHCP works with broadcasts on UDP/67.
services:
  kea-manager:
    image: gemini2350/kea-manager:latest
    container_name: kea-manager
    hostname: kea-manager
    network_mode: host
    environment:
      - TZ=UTC
      # Optional: HTTPS via ACME (see README "HTTPS for the Web UI")
      # - ACME_DOMAIN=dhcp.example.lan
      # - ACME_DIRECTORY_URL=https://ca.example.lan:9000/acme/acme/directory
      # - ACME_CA_BUNDLE=/etc/kea/tls/root_ca.crt
      # Optional: behind a TLS-terminating reverse proxy instead
      # - KEA_BEHIND_PROXY=1
    volumes:
      - ./kea-config:/etc/kea    # config, auth.db, session key
      - ./kea-leases:/var/lib/kea # lease database
    # Give supervisord enough time to shut kea-dhcp4 down cleanly, so the
    # lease journal is always consistent across reboots (default is 10s).
    stop_grace_period: 30s
    restart: always
