services:
  kea-manager:
    # Lokal gebautes Image (enthält Vendor-Lookup). Bauen mit: docker compose build
    image: kea-manager:local
    build: .
    container_name: kea-manager
    hostname: kea-manager
    network_mode: host
    environment:
      - TZ=Europe/Berlin
    volumes:
      # Persistente KEA-Konfig, Auth-DB und Leases auf dem Host
      - /etc/kea-manager:/etc/kea
    restart: always
